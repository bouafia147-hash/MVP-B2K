
name: Build MVP B2K APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Install Java and Android SDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install AIDL and SDK tools
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build APK
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          elif [ -f buildozer.spec ]; then
            pip install buildozer cython
            sudo apt-get update
            sudo apt-get install -y \
              git zip unzip autoconf libtool pkg-config \
              zlib1g-dev libncurses-dev libtinfo6 \
              cmake libffi-dev libssl-dev \
              automake autopoint gettext
            buildozer android debug
          else
            echo "ERROR: No Android project or buildozer.spec found."
            exit 1
          fi

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MVP-B2K-APK
          path: |
            **/build/outputs/apk/debug/*.apk
            bin/*.apk
          if-no-files-found: error
          
